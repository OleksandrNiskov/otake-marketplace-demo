  function mapPanel(people,large=false){const visible=people.slice(0,large?15:10);const lo=[-74.035,-73.915],la=[40.61,40.73];return `<div class="map-panel" role="group" aria-label="Illustrative map of fictional specialist locations"><div class="map-water"></div><span class="map-label" style="top:15%;left:27%">BROOKLYN</span><span class="map-label" style="top:76%;left:22%">PARK SLOPE</span><span class="map-label" style="top:35%;left:60%">WILLIAMSBURG</span>${visible.map(p=>{const x=Math.max(8,Math.min(88,100*(p.lng-lo[0])/(lo[1]-lo[0]))),y=Math.max(12,Math.min(90,100*(la[1]-p.lat)/(la[1]-la[0])));return `<a title="Open ${esc(p.name)} profile" aria-label="Open ${esc(p.name)} profile" class="map-pin" href="${link("profile",{specialist:p.id})}" style="left:${x}%;top:${y}%">${money(p.price)}</a>`;}).join("")}<span class="map-foot">Illustrative map · fictional location centres</span>${!large?`<a class="btn secondary small map-preview-cta" href="${link("find")}">Explore specialists →</a>`:""}</div>`;}

  function find(){if(qs().get("service") && Object.hasOwn(SERVICE,qs().get("service")))ui.filter=qs().get("service");const matches=list().filter(p=>ui.filter==="all"||p.services.includes(ui.filter));const sorted=ui.sort==="name"?[...matches].sort((a,b)=>a.name.localeCompare(b.name)):matches;return `<div class="searchheader"><div><a href="${link("home")}" class="back">← Marketplace</a><h1>Find a specialist</h1></div><a class="btn secondary" href="${link("start")}">Become a specialist</a></div>

  const statusColor = s=>["completed","confirmed"].includes(s)?"green":["cancelled","declined"].includes(s)?"":"gold";
  function ordersPage(role="customer"){const orders=currentOrders().slice().reverse();return `<div class="searchheader"><div><h1>${role==="provider"?"Specialist requests":"My requests"}</h1><p class="sm" style="margin-top:9px">Demo requests saved in this browser.</p></div><div class="segmented"><a class="btn ${role==="customer"?"":"secondary"} small" href="${link("orders")}">Customer</a><a class="btn ${role==="provider"?"":"secondary"} small" href="${link("inbox")}">Specialist</a></div></div>
 ${!orders.length?`<div class="empty"><span style="font-size:40px">▤</span><h2>No demo requests yet</h2><p>Find a specialist, choose a service, and send a test request to see it here.</p><a class="btn" href="${link("find")}">Find a specialist →</a></div>`:`${role==="provider"?`<div class="notice warn">Specialist view simulates how requests are handled. You can accept or decline your own test requests.</div>`:""}${orders.map(o=>{const p=byId(o.providerId)||{name:o.providerName||"Specialist"};return `<article class="ordercard"><div class="orderhead"><div><span class="sm muted">REQUEST #${esc(o.id.slice(-6).toUpperCase())}</span><h3>${esc(SERVICE[o.service]?.title||"Demo service")}</h3><p class="sm">${role==="provider"?"Customer: "+esc(o.name):"Specialist: "+esc(p.name)}</p></div><span class="pill ${statusColor(o.status)}">${esc(o.status.replaceAll("_"," "))}</span></div><div class="summary-lines"><div><span>Requested time</span><strong>${esc(date(o.slot))}</strong></div><div><span>Location</span><strong>${esc(o.area)}${o.zip?", "+esc(o.zip):""}</strong></div><div><span>Demo price</span><strong>${money(o.price)}</strong></div></div><p class="sm">${esc(o.details)}</p><div class="row wrap"><button class="btn secondary small" data-action="open-chat" data-id="${esc(o.providerId)}">View conversation →</button>${["requested","confirmed"].includes(o.status)&&role==="customer"?btn("Cancel request","cancel-order",`data-order="${esc(o.id)}"`,"btn danger small"):""}${o.status==="requested"&&role==="provider"?`${btn("Accept","accept-order",`data-order="${esc(o.id)}"`,"btn small")}${btn("Decline","decline-order",`data-order="${esc(o.id)}"`,"btn secondary small")}`:""}${o.status==="confirmed"&&role==="provider"?btn("Mark completed","complete-order",`data-order="${esc(o.id)}"`,"btn small"):""}</div></article>`;}).join("")}`}`;}
  function openChat(id){ui.chatId=id;const p=byId(id);if(!p){go("messages");return;}store.threads[id] ||= [{actor:"system",text:`Demo conversation with ${p.name}. This is a local preview: messages are not delivered.`,at:new Date().toISOString()}];save();go("messages",{specialist:id});}
  function messagesPage(){const names=Object.keys(store.threads||{});const fromQuery=qs().get("specialist");const active=byId(fromQuery)?fromQuery:byId(ui.chatId)?ui.chatId:names[0]||"";if(active)ui.chatId=active;const p=byId(active);const thread=store.threads[active]||[];return `<div class="searchheader"><div><h1>Messenger</h1><p class="sm" style="margin-top:8px">Browse and send simulated messages inside this demo.</p></div><a class="btn secondary" href="${link("find")}">Find a specialist</a></div><div class="messagearea"><aside class="threads">${names.length?names.map(id=>{const peer=byId(id);if(!peer)return"";return `<a class="thread ${active===id?"active":""}" href="${link("messages",{specialist:id})}">${avatar(peer,"sm")}<div><strong>${esc(peer.name)}</strong><p class="sm">${esc(peer.headline)}</p></div></a>`;}).join(""):`<div class="card"><p class="sm">No conversations yet. Open a specialist profile and choose Message specialist.</p><a class="btn small" style="margin-top:15px" href="${link("find")}">Browse specialists</a></div>`}</aside>${p?`<section class="card chat"><div class="person">${avatar(p,"sm")}<div><h3>${esc(p.name)}</h3><p class="sm">Local demo conversation</p></div><a style="margin-left:auto" href="${link("profile",{specialist:p.id})}" class="btn secondary small">View profile</a></div><hr class="divider"><div class="chatlogs">${thread.map(m=>`<div class="bubble ${m.actor==="me"?"mine":""}">${esc(m.text)}<div class="smallnote" style="margin-top:3px">${m.actor==="me"?"You":"Demo"}</div></div>`).join("")}</div><form id="chat-form" class="chat-compose"><input name="message" type="text" maxlength="500" required placeholder="Write a demo message..." autocomplete="off" aria-label="Message text"><button class="btn" type="submit">Send →</button></form><p class="smallnote" style="margin-top:9px">No messages are delivered to a real person.</p></section>`:`<section class="empty"><h2>Choose a conversation</h2><p>Start by opening a fictional specialist profile.</p><a class="btn" href="${link("find")}">Find specialists</a></section>`}</div>`;}
  function startPage(){return `<a class="back" href="${link("home")}">← Marketplace</a><div class="grid2" style="align-items:center;gap:45px"><div><span class="eyebrow">FOR SPECIALISTS</span><h1 class="headline" style="margin-top:18px;font-size:clamp(38px,5vw,52px)">Turn your skills into opportunities.</h1><p class="subhead">Try the Otake specialist flow: profile, availability, checks, and publish — all in a browser-only demo.</p><div class="hero-actions">${btn(store.specialist?"Manage demo profile →":"Create specialist profile →","start-join")}</div><p class="smallnote">Nothing will be publicly listed outside this demo. No identity check or payment setup is performed.</p></div><div class="card" style="overflow:hidden;background:#eff5ff"><div style="height:285px;display:grid;place-items:center">${img("how-it-works.webp","Otake Marketplace demo")}</div></div></div><section class="section"><div class="steps-cards"><div class="stepcard"><span class="stepnum">01</span><h3>Your profile</h3><p>Add your name, service and description.</p></div><div class="stepcard"><span class="stepnum">02</span><h3>Availability</h3><p>Choose example workdays and times.</p></div><div class="stepcard"><span class="stepnum">03</span><h3>Publish demo</h3><p>See your specialist profile in the local catalog.</p></div></div></section>`;}
  function joinPage(){const step=ui.joinStep;const p=store.specialist||{name:"",bio:"",neighborhood:"Brooklyn",services:["assembly"],price:80,headline:"",workdays:["Monday","Tuesday","Wednesday","Thursday","Friday"]};return `<a class="back" href="${link("start")}">← For specialists</a><div class="searchheader"><div><h1>Your specialist profile</h1><p class="sm" style="margin-top:8px">${["Tell clients what you do.","Choose when you're available.","Your checks, one step at a time.","One last look before you publish."][step]}</p></div><span class="pill ${store.publish?"green":"gold"}">${store.publish?"Published locally":"Private draft"}</span></div><div class="wizard"><nav class="wizard-nav" aria-label="Onboarding steps">${["Profile basics","Availability","Verification","Preview & publish"].map((name,i)=>`<button data-action="join-step" data-step="${i}" class="${i===step?"current":""}"><span class="count">${i+1}</span>${name}</button>`).join("")}<a class="btn secondary full" href="${link("toolbox")}">⚒ My Toolbox</a><a class="btn secondary full" href="${link("inbox")}">▣ Specialist requests</a></nav><div class="card">
  ${step===0?`<h2 style="font-size:24px;margin-bottom:10px">Tell clients what you do</h2><p class="sm" style="margin-bottom:18px">Your details are saved in your browser only.</p><form id="specialist-form"><div class="field"><label>Your name</label><input name="name" required maxlength="60" placeholder="Your display name" value="${esc(p.name)}"></div><div class="field"><label>Headline</label><input name="headline" required maxlength="80" placeholder="Furniture assembly specialist" value="${esc(p.headline)}"></div><div class="field"><label>About you</label><textarea name="bio" required minlength="15" maxlength="600" placeholder="Tell customers about your services...">${esc(p.bio)}</textarea></div><div class="grid2"><div class="field"><label>Work area</label><select name="neighborhood">${["Brooklyn","Downtown Brooklyn","Park Slope","Williamsburg","Fort Greene","Greenpoint","Bushwick"].map(a=>`<option ${p.neighborhood===a?"selected":""}>${a}</option>`).join("")}</select></div><div class="field"><label>Starting price ($)</label><input name="price" type="number" min="10" max="1000" step="1" required value="${esc(p.price)}"></div></div><div class="field"><label>Primary service</label><select name="service">${Object.entries(SERVICE).map(([id,s])=>`<option value="${id}" ${p.services.includes(id)?"selected":""}>${esc(s.title)}</option>`).join("")}</select></div><button class="btn" type="submit">Save & continue →</button></form>`:""}
  ${step===1?`<h2 style="font-size:24px">When can clients book?</h2><p style="margin:8px 0 20px">Select your demo workdays. The preview uses example times.</p><form id="availability-form">${["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"].map(d=>`<label class="checkrow"><input type="checkbox" name="days" value="${d}" ${(p.workdays||[]).includes(d)?"checked":""}><span>${d}</span></label>`).join("")}<div class="row space">${btn("← Back","join-back","","btn secondary")}<button class="btn" type="submit">Save & continue →</button></div></form>`:""}
  ${step===2?`<h2 style="font-size:24px;margin-bottom:12px">Demo verification</h2><p>In the live product, specialists may need to verify their identity and payment details. This preview does not collect documents or payment information.</p><div class="notice">✓ Demo mode: verification is simulated, no personal documents are required.</div><div class="checkrow"><span>✓</span><span>Identity check — skipped in demo</span></div><div class="checkrow"><span>✓</span><span>Payout setup — skipped in demo</span></div><div class="row space" style="margin-top:20px">${btn("← Back","join-back","","btn secondary")}${btn("Continue to preview →","join-next")}</div>`:""}
  ${step===3?`<h2 style="font-size:24px;margin-bottom:16px">Preview your public profile</h2>${!store.specialist?`<div class="notice warn">Complete Profile basics to publish your demo profile.</div>`:`<div class="person" style="margin-bottom:19px"><div class="avatar lg" style="display:grid;place-items:center;background:#dce6ff;color:#1648ed;font-size:30px">${esc(p.name.charAt(0))}</div><div><h2 style="font-size:24px">${esc(p.name)}</h2><p>${esc(p.headline)}</p><span class="pill">${esc(p.neighborhood)}</span></div></div><div class="summary-lines"><div><span>Service</span><strong>${esc(SERVICE[p.services[0]]?.title||"Service")}</strong></div><div><span>From</span><strong>${money(p.price)}</strong></div><div><span>Workdays</span><strong>${esc((p.workdays||[]).length)} days selected</strong></div></div><p style="margin:17px 0">${esc(p.bio)}</p><div class="notice warn">Publishing lists this fictional profile only inside this browser's demo. It does not create an Otake account.</div><div class="row wrap">${btn(store.publish?"Pause demo listing":"Publish demo profile","publish","","btn")}${btn("← Back","join-back","","btn secondary")}${store.publish?`<a class="btn secondary" href="${link("profile",{specialist:"my-specialist"})}">View my profile →</a>`:""}</div>`}`:""}
  </div></div>`;}
  function toolboxPage(){const items=store.toolbox||[];return `<a class="back" href="${link("join")}">← My specialist profile</a><h1 class="headline">My Toolbox</h1><p class="subhead">Add example equipment to your demo specialist setup.</p><div class="grid2"><section class="card"><h2 style="font-size:23px;margin-bottom:20px">Tools & equipment</h2>${items.length?items.map((item,i)=>`<div class="service-listitem" style="margin-bottom:9px"><span>⚒ ${esc(item)}</span>${btn("Remove","remove-tool",`data-index="${i}"`,"btn secondary small")}</div>`).join(""):`<p>No items added yet.</p>`}</section><section class="card"><h2 style="font-size:23px;margin-bottom:17px">Add equipment</h2><form id="tool-form"><div class="field"><label>Name</label><input name="tool" required maxlength="75" placeholder="E.g., Cordless drill"></div><button class="btn" type="submit">+ Add to toolbox</button></form><div class="divider"></div><h3 style="font-size:17px;margin-bottom:10px">Suggestions</h3><div class="tagrow">${["Step ladder","Cordless drill","Level","Tape measure","Moving blankets"].map(n=>btn(esc(n),"suggest-tool",`data-tool="${esc(n)}"`,"pill")).join("")}</div></section></div>`;}
  function pagePreview(){const p=selectedProvider();return `<a class="back" href="${link("profile",{specialist:p.id})}">← Back to Marketplace profile</a><div class="grid2" style="align-items:start"><div><span class="eyebrow">CONNECTED PAGE PREVIEW</span><h1 class="headline" style="margin-top:17px">${esc(p.name)}'s page</h1><p class="subhead">This represents how a specialist's public page can connect back to the Marketplace.</p><div class="access-note">Static illustration. The real Otake Pages editor and external profile links are not included in this GitHub Pages demo.</div></div><div class="card shadow" style="max-width:480px;text-align:center"><div style="display:grid;justify-items:center;gap:12px">${avatar(p,"lg")}<h2 style="font-size:27px">${esc(p.name)}</h2><p>${esc(p.headline)}</p><span class="pill blue">Otake specialist</span></div><hr class="divider"><p style="margin-bottom:20px">${esc(p.bio)}</p>${p.services.map(id=>`<a class="btn secondary full" style="margin-bottom:10px" href="${link("service",{specialist:p.id,offering:id})}">${esc(SERVICE[id].title)} →</a>`).join("")}<a class="btn full" href="${link("profile",{specialist:p.id})}">Open Marketplace profile →</a></div></div>`;}
  function render(){const v=view();const body={home,find,profile,service:servicePage,request:requestPage,orders:()=>ordersPage("customer"),inbox:()=>ordersPage("provider"),messages:messagesPage,start:startPage,join:joinPage,toolbox:toolboxPage,page:pagePreview};try{app.innerHTML=`${navi()}${bar()}<main class="shell content" id="main">${(body[v]||home)()}</main><footer class="foot shell"><span>© Otake Marketplace · Click-through preview</span><span>All specialists are fictional · Browser-only data · No real bookings or payments</span></footer><div id="demo-toast" class="toast" role="status" ${ui.toast?"":"hidden"}>${esc(ui.toast)}</div>`;}catch(error){app.innerHTML=`<main class="shell" style="padding:60px 0"><h1>Unable to show this demo screen</h1><p class="subhead">Please return to the marketplace home page.</p><a class="btn" href="?view=home">Go home →</a></main>`;console.error("Marketplace render error",error);}}
  function updateOrder(id,status){const o=currentOrders().find(order=>order.id===id);if(!o)return;o.status=status;o.updatedAt=new Date().toISOString();const s={accepted:"confirmed",declined:"declined",cancelled:"cancelled",completed:"completed"};store.threads[o.providerId]||=[];store.threads[o.providerId].push({actor:"system",text:`Request ${o.id.slice(-6).toUpperCase()}: ${status.replaceAll("_"," ")}.`,at:o.updatedAt});save();render();notify("Demo request updated.");}
  app.addEventListener("click", async e=>{
    const actionEl=e.target.closest("[data-action]");
    if(actionEl){e.preventDefault();const action=actionEl.dataset.action,id=actionEl.dataset.id;
      switch(action){
        case "specialist-menu":go(store.specialist?"join":"start");break;
        case "start-join":ui.joinStep=store.specialist?3:0;go("join");break;
        case "share":{const url=location.href;try{await navigator.clipboard.writeText(url);notify("Preview link copied.");}catch{window.prompt("Copy this preview link:",url);}break;}
        case "reset":if(confirm("Reset the entire local demo? This clears your example requests, messages, and specialist profile only in this browser.")){localStorage.removeItem(KEY);store=emptyStore();ui={filter:"all",area:"Brooklyn",sort:"availability",layout:"split",city:"nyc",requestStep:0,joinStep:0,selectedSlot:"",requestDraft:{},chatId:"",requestProvider:"",requestService:"",announcement:"",toast:""};go("home");notify("Demo reset.");}break;
        case "layout":ui.layout=actionEl.dataset.layout;render();break;
        case "chip":ui.filter=actionEl.dataset.service;go("find",{service:ui.filter});break;
        case "clear-filter":ui.filter="all";go("find");break;
        case "choose-brooklyn":ui.area="Brooklyn";render();break;
        case "open-chat":openChat(id||selectedProvider().id);break;
        case "begin-request":beginRequest(id,actionEl.dataset.service);break;
        case "slot":ui.selectedSlot=actionEl.dataset.slot;render();break;
        case "request-next":if(ui.selectedSlot){ui.requestStep=1;render();}break;
        case "request-back":ui.requestStep=Math.max(0,ui.requestStep-1);render();break;
        case "cancel-order":updateOrder(actionEl.dataset.order,"cancelled");break;
        case "accept-order":updateOrder(actionEl.dataset.order,"confirmed");break;
        case "decline-order":updateOrder(actionEl.dataset.order,"declined");break;
        case "complete-order":updateOrder(actionEl.dataset.order,"completed");break;
        case "join-step":ui.joinStep=Math.max(0,Math.min(3,Number(actionEl.dataset.step)));render();break;
        case "join-next":ui.joinStep=Math.min(3,ui.joinStep+1);render();break;
        case "join-back":ui.joinStep=Math.max(0,ui.joinStep-1);render();break;
        case "publish":if(!store.specialist||!store.specialist.name){ui.joinStep=0;render();notify("Complete your profile first.");}else{store.publish=!store.publish;save();render();notify(store.publish?"Profile published in this browser's demo catalog.":"Demo profile hidden from the catalog.");}break;
        case "remove-tool":store.toolbox.splice(Number(actionEl.dataset.index),1);save();render();notify("Item removed.");break;
        case "suggest-tool":{const val=actionEl.dataset.tool;if(!store.toolbox.includes(val)){store.toolbox.push(val);save();}render();notify("Tool added.");break;}
      }return;
    }
    const anchor=e.target.closest("a[href]");if(!anchor||e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey||anchor.target==="_blank")return;
    const url=new URL(anchor.href,location.href);if(url.origin===location.origin&&url.pathname===location.pathname&&url.searchParams.has("view")){e.preventDefault();const params=Object.fromEntries(url.searchParams);const next=params.view;delete params.view;if(next==="request"){ui.requestStep=0;ui.selectedSlot="";}if(next==="find"&&params.service)ui.filter=params.service;go(next,params);}
  });
  app.addEventListener("change",e=>{const el=e.target;if(el.dataset.change==="area"){ui.area=el.value;render();}else if(el.dataset.change==="filter"){ui.filter=el.value;go("find",{...(ui.filter!=="all"?{service:ui.filter}:{})});}else if(el.dataset.change==="sort"){ui.sort=el.value;render();}});
  app.addEventListener("submit", e=>{
    const form=e.target;if(!(form instanceof HTMLFormElement))return;e.preventDefault();
    const data=new FormData(form),value=name=>String(data.get(name)||"").trim();
    if(form.id==="request-details"){
      ui.requestDraft={...ui.requestDraft,details:value("details"),area:value("area"),zip:value("zip"),access:value("access")};
      if(ui.requestDraft.details.length<10){notify("Add at least 10 characters to describe the job.");return;}
      ui.requestStep=2;render();return;
    }
    if(form.id==="request-contact"){
      if(!data.get("ack")){notify("Please confirm this is only a demo.");return;}
      const p=selectedProvider(),id="demo-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,7),service=offeringId();
      const order={id,providerId:p.id,providerName:p.name,service,slot:ui.selectedSlot,details:ui.requestDraft.details,area:ui.requestDraft.area,zip:ui.requestDraft.zip,access:ui.requestDraft.access,name:value("name"),contact:value("contact"),price:p.price,status:"requested",createdAt:new Date().toISOString()};
      if(!order.slot||!order.details){notify("Complete the earlier steps first.");ui.requestStep=0;render();return;}
      store.orders.push(order);store.threads[p.id]||=[];store.threads[p.id].push({actor:"system",text:`Demo request created: ${SERVICE[service]?.title}. ${date(order.slot)}. The specialist can review this in Specialist requests.`,at:order.createdAt});save();ui.requestStep=0;ui.requestDraft={};ui.selectedSlot="";go("orders");notify("Demo request created. No real booking was made.");return;
    }
    if(form.id==="chat-form"){
      if(!ui.chatId||!byId(ui.chatId)){notify("Choose a specialist first.");return;}
      const message=value("message");if(!message)return;store.threads[ui.chatId]||=[];store.threads[ui.chatId].push({actor:"me",text:message,at:new Date().toISOString()});save();render();const log=$(".chatlogs");if(log)log.scrollTop=log.scrollHeight;notify("Message saved in local demo (not sent).");return;
    }
    if(form.id==="specialist-form"){
      store.specialist={name:value("name"),headline:value("headline"),bio:value("bio"),neighborhood:value("neighborhood"),price:Number(value("price")),services:[value("service")],workdays:store.specialist?.workdays||["Monday","Tuesday","Wednesday","Thursday","Friday"]};save();ui.joinStep=1;render();notify("Draft saved locally.");return;
    }
    if(form.id==="availability-form"){
      const checked=data.getAll("days").map(String);if(!checked.length){notify("Select at least one workday.");return;}
      store.specialist ||= {name:"",headline:"",bio:"",neighborhood:"Brooklyn",price:80,services:["assembly"]};store.specialist.workdays=checked;save();ui.joinStep=2;render();notify("Demo availability saved.");return;
    }
    if(form.id==="tool-form"){
      const tool=value("tool");if(!tool)return;if(!store.toolbox.includes(tool))store.toolbox.push(tool);save();render();notify("Tool added to demo toolbox.");return;
    }
  });
  window.addEventListener("popstate",()=>{ui.toast="";render();});
  render();
})();

</script>
</body>
</html>
